---
# Remove tags from one NTP policy by name (key-based cleanup).

- name: Remove tags from a single Intersight NTP policy
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resolved_api_key_id: "{{ api_key_id | default(lookup('env', 'INTERSIGHT_API_KEY_ID'), true) }}"
    resolved_api_private_key: "{{ api_private_key | default(lookup('env', 'INTERSIGHT_API_PRIVATE_KEY'), true) }}"

  module_defaults:
    cisco.intersight.intersight_rest_api:
      api_key_id: "{{ resolved_api_key_id }}"
      api_private_key: "{{ resolved_api_private_key }}"
      api_uri: "https://intersight.com/api/v1"
      validate_certs: true

  pre_tasks:
    - name: Validate required inputs
      ansible.builtin.assert:
        that:
          - ntp_policy_name is defined and ntp_policy_name | length > 0
          - policy_tags is defined and policy_tags | length > 0
          - policy_tags[0].Key is defined
          - resolved_api_key_id | length > 0
          - resolved_api_private_key | length > 0
        fail_msg: >-
          Required values missing. Provide ntp_policy_name, policy_tags (Key list),
          and credentials (api_key_id/api_private_key or INTERSIGHT_API_* env vars).

  tasks:
    - name: Look up NTP policy by name
      cisco.intersight.intersight_rest_api:
        resource_path: /ntp/Policies
        query_params:
          $filter: "Name eq '{{ ntp_policy_name }}'"
        return_list: true
      register: ntp_lookup

    - name: Fail if NTP policy not found
      ansible.builtin.fail:
        msg: "NTP policy '{{ ntp_policy_name }}' was not found in Intersight."
      when: (ntp_lookup.api_response | default([])) | length == 0

    - name: Store NTP policy Moid
      ansible.builtin.set_fact:
        ntp_policy_moid: "{{ ntp_lookup.api_response[0].Moid }}"

    - name: Fetch current NTP policy details
      cisco.intersight.intersight_rest_api:
        resource_path: "/ntp/Policies/{{ ntp_policy_moid }}"
        return_list: false
      register: ntp_current

    - name: Build cleanup tag list
      ansible.builtin.set_fact:
        tag_keys_to_remove: "{{ policy_tags | map(attribute='Key') | list }}"
        existing_tags: "{{ ntp_current.api_response.Tags | default([]) }}"
        filtered_tags: >-
          {{
            (ntp_current.api_response.Tags | default([]))
            | rejectattr('Key', 'in', policy_tags | map(attribute='Key') | list)
            | list
          }}

    - name: Compute removal count
      ansible.builtin.set_fact:
        removed_count: "{{ (existing_tags | length) - (filtered_tags | length) }}"

    - name: Display cleanup summary
      ansible.builtin.debug:
        msg:
          - "Policy: {{ ntp_policy_name }}"
          - "Existing tags: {{ existing_tags | length }}"
          - "Requested remove keys: {{ tag_keys_to_remove | length }}"
          - "Removed: {{ removed_count }}"
          - "Remaining tags: {{ filtered_tags | length }}"

    - name: Apply filtered tags to NTP policy
      cisco.intersight.intersight_rest_api:
        resource_path: "/ntp/Policies/{{ ntp_policy_moid }}"
        api_body:
          Tags: "{{ filtered_tags }}"
        state: present
      when: removed_count | int > 0

    - name: No matching tags to remove
      ansible.builtin.debug:
        msg: "No matching tag keys found on '{{ ntp_policy_name }}'; no update required."
      when: removed_count | int == 0
