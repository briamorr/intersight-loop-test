---
# =============================================================================
# Playbook: set_ntp_policy_tags.yml
#
# Applies one or more key/value tags to a single NTP policy by name,
# merging with any existing tags on that policy.
#
# Expected variables (must be set before calling, e.g., via -e or include_tasks):
#   ntp_policy_name: "MyNTPPolicy"         # Exact name of the policy
#   policy_tags: [                         # List of tags to add/update
#     {"Key":"Env","Value":"Prod"},
#     {"Key":"Owner","Value":"NetOps"}
#   ]
#
# Authentication – set the following environment variables before running:
#   export INTERSIGHT_API_KEY_ID="<your-key-id>"
#   export INTERSIGHT_API_PRIVATE_KEY="<path-to-your-pem-key-file>"
#
# Standalone Usage (CLI):
#   ansible-playbook -i inventory set_ntp_policy_tags.yml \
#     -e "ntp_policy_name=MyNTPPolicy" \
#     -e 'policy_tags=[{"Key":"Env","Value":"Prod"}]'
#
# Used by: set_ntp_policy_tags_multi.yml (wrapper for multiple policies)
# =============================================================================

- name: Apply tags to a single Intersight NTP policy
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    api_key_id: "{{ lookup('env', 'INTERSIGHT_API_KEY_ID') }}"
    api_private_key: "{{ lookup('env', 'INTERSIGHT_API_PRIVATE_KEY') }}"
    api_uri: "https://intersight.com/api/v1"
    validate_certs: true

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ntp_policy_name is defined and ntp_policy_name | length > 0
          - policy_tags is defined and policy_tags | length > 0
        fail_msg: >-
          Required variables not set.
          Must provide: ntp_policy_name (string) and policy_tags (list).
      run_once: true

  tasks:

    # -------------------------------------------------------------------------
    # 1. Look up the NTP policy by name
    # -------------------------------------------------------------------------
    - name: Look up NTP policy by name
      cisco.intersight.intersight_rest_api:
        api_key_id: "{{ api_key_id }}"
        api_private_key: "{{ api_private_key }}"
        api_uri: "{{ api_uri }}"
        validate_certs: "{{ validate_certs }}"
        resource_path: /ntp/Policies
        query_params:
          $filter: "Name eq '{{ ntp_policy_name }}'"
        return_list: true
      register: ntp_lookup

    - name: Fail if NTP policy not found
      ansible.builtin.fail:
        msg: >-
          NTP policy '{{ ntp_policy_name }}' was not found in Intersight.
          Verify the name and try again.
      when: (ntp_lookup.api_response | default([])) | length == 0

    - name: Warn if multiple NTP policies matched the name
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ ntp_lookup.api_response | length }} policies matched
          '{{ ntp_policy_name }}'. Using the first result
          (Moid: {{ ntp_lookup.api_response[0].Moid }}).
      when: ntp_lookup.api_response | length > 1

    - name: Store NTP policy Moid
      ansible.builtin.set_fact:
        ntp_policy_moid: "{{ ntp_lookup.api_response[0].Moid }}"

    - name: Display resolved NTP policy
      ansible.builtin.debug:
        msg: "Resolved NTP policy '{{ ntp_policy_name }}' → Moid: {{ ntp_policy_moid }}"

    # -------------------------------------------------------------------------
    # 2. Parse tags from the prompt string into a list of dicts
    #    (skipped when policy_tags was already provided via extra-vars)
    # -------------------------------------------------------------------------
    - name: Build tags list from prompt input
      ansible.builtin.set_fact:
        policy_tags: >-
          {{
            tags_raw.split(',')
            | map('trim')
            | select('search', '=')
            | map('regex_replace', '^([^=]+)=(.*)$', '{"Key": "\1", "Value": "\2"}')
            | map('from_json')
            | list
          }}
      when: policy_tags | length == 0 and tags_raw is defined and tags_raw | length > 0

    - name: Fail if no tags were provided
      ansible.builtin.fail:
        msg: >-
          No tags were provided. Supply tags via the prompt (Key=Value,...) or
          via extra-vars: -e 'policy_tags=[{"Key":"K","Value":"V"}]'
      when: policy_tags | length == 0

    # -------------------------------------------------------------------------
    # 3. Read existing tags so we can merge rather than replace
    # -------------------------------------------------------------------------
    - name: Fetch current NTP policy details
      cisco.intersight.intersight_rest_api:
        api_key_id: "{{ api_key_id }}"
        api_private_key: "{{ api_private_key }}"
        api_uri: "{{ api_uri }}"
        validate_certs: "{{ validate_certs }}"
        resource_path: "/ntp/Policies/{{ ntp_policy_moid }}"
        return_list: false
      register: ntp_current

    - name: Build merged tag list
      # Start with existing tags, then overlay/add any new ones.
      # If a supplied Key already exists, the new Value wins.
      ansible.builtin.set_fact:
        merged_tags: >-
          {{
            (ntp_current.api_response.Tags | default([]))
            | rejectattr('Key', 'in', policy_tags | map(attribute='Key') | list)
            | list
            + policy_tags
          }}

    - name: Display existing and merged tags
      ansible.builtin.debug:
        msg:
          - "Existing tags : {{ ntp_current.api_response.Tags | default([]) }}"
          - "New/updated   : {{ policy_tags }}"
          - "Merged result : {{ merged_tags }}"

    # -------------------------------------------------------------------------
    # 4. Apply the merged tags via PATCH
    # -------------------------------------------------------------------------
    - name: Set merged tags on NTP policy
      cisco.intersight.intersight_rest_api:
        api_key_id: "{{ api_key_id }}"
        api_private_key: "{{ api_private_key }}"
        api_uri: "{{ api_uri }}"
        validate_certs: "{{ validate_certs }}"
        resource_path: "/ntp/Policies/{{ ntp_policy_moid }}"
        api_body:
          Tags: "{{ merged_tags }}"
        state: present
      register: patch_result

    - name: Confirm tags applied
      ansible.builtin.debug:
        msg: >-
          Successfully applied {{ policy_tags | length }} tag(s) to NTP policy
          '{{ ntp_policy_name }}' (Moid: {{ ntp_policy_moid }}).
          Total tags on policy: {{ merged_tags | length }}.
