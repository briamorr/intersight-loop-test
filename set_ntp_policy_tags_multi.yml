---
# Wrapper for multi-policy tag operations.
#
# Inputs:
# - policy_tags_yaml: YAML list of policies and tags
# - tag_operation: set | cleanup (default: set)
# - api_key_id / api_private_key: provided by AAP credential

- name: Prepare policy workers
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    worker_group_name: ntp_policy_workers
    worker_host_prefix: ntp_policy_worker
    requested_tag_operation: "{{ tag_operation | default('set') }}"

  tasks:
    - name: Validate required wrapper inputs
      ansible.builtin.assert:
        that:
          - requested_tag_operation in ['set', 'cleanup']
          - policy_tags_yaml is defined
          - policy_tags_yaml | length > 0
          - api_key_id is defined
          - api_key_id | length > 0
          - api_private_key is defined
          - api_private_key | length > 0
        fail_msg: >-
          Required inputs missing. Expected: policy_tags_yaml, tag_operation (set|cleanup),
          api_key_id, and api_private_key.

    - name: Parse policy_tags_yaml
      ansible.builtin.set_fact:
        parsed_policies: "{{ policy_tags_yaml | from_yaml }}"

    - name: Validate each policy entry
      ansible.builtin.assert:
        that:
          - item.policy_name is defined and item.policy_name | length > 0
          - item.tags is defined and item.tags | length > 0
          - item.tags[0].Key is defined
          - requested_tag_operation == 'cleanup' or item.tags[0].Value is defined
        fail_msg: >-
          Invalid policy entry: {{ item }}
          Expected policy_name and tags; for set, each tag needs Key and Value.
      loop: "{{ parsed_policies }}"
      loop_control:
        label: "{{ item.policy_name | default('UNKNOWN') }}"

    - name: Display operation plan
      ansible.builtin.debug:
        msg: >-
          Preparing {{ parsed_policies | length }} worker(s) for
          '{{ requested_tag_operation }}' operation.

    - name: Create one worker host per policy
      ansible.builtin.add_host:
        name: "{{ worker_host_prefix }}_{{ worker_index }}"
        groups: "{{ worker_group_name }}"
        ansible_connection: local
        ntp_policy_name: "{{ item.policy_name }}"
        policy_tags: "{{ item.tags }}"
      loop: "{{ parsed_policies }}"
      loop_control:
        index_var: worker_index
        label: "{{ item.policy_name }}"

- name: Run operation in parallel per policy worker
  hosts: ntp_policy_workers
  gather_facts: false
  strategy: free

  vars:
    tag_operation: "{{ hostvars['localhost'].requested_tag_operation }}"

  module_defaults:
    cisco.intersight.intersight_rest_api:
      api_key_id: "{{ api_key_id }}"
      api_private_key: "{{ api_private_key }}"
      api_uri: "https://intersight.com/api/v1"
      validate_certs: true

  tasks:
    - name: Process one policy
      block:
        - name: Resolve NTP policy by name
          cisco.intersight.intersight_rest_api:
            resource_path: /ntp/Policies
            query_params:
              $filter: "Name eq '{{ ntp_policy_name }}'"
            return_list: true
          register: ntp_lookup

        - name: Fail if policy not found
          ansible.builtin.fail:
            msg: "NTP policy '{{ ntp_policy_name }}' not found in Intersight."
          when: (ntp_lookup.api_response | default([])) | length == 0

        - name: Store selected policy Moid
          ansible.builtin.set_fact:
            ntp_policy_moid: "{{ ntp_lookup.api_response[0].Moid }}"

        - name: Fetch current policy details
          cisco.intersight.intersight_rest_api:
            resource_path: "/ntp/Policies/{{ ntp_policy_moid }}"
            return_list: false
          register: ntp_current

        - name: Build set-operation merged tags
          ansible.builtin.set_fact:
            tags_to_apply: >-
              {{
                (ntp_current.api_response.Tags | default([]))
                | rejectattr('Key', 'in', policy_tags | map(attribute='Key') | list)
                | list
                + policy_tags
              }}
          when: tag_operation == 'set'

        - name: Build cleanup-operation filtered tags
          ansible.builtin.set_fact:
            tag_keys_to_remove: "{{ policy_tags | map(attribute='Key') | list }}"
            existing_tags: "{{ ntp_current.api_response.Tags | default([]) }}"
            tags_to_apply: >-
              {{
                (ntp_current.api_response.Tags | default([]))
                | rejectattr('Key', 'in', policy_tags | map(attribute='Key') | list)
                | list
              }}
          when: tag_operation == 'cleanup'

        - name: Calculate removal count for cleanup
          ansible.builtin.set_fact:
            removed_count: "{{ (existing_tags | length) - (tags_to_apply | length) }}"
          when: tag_operation == 'cleanup'

        - name: Apply tags to policy
          cisco.intersight.intersight_rest_api:
            resource_path: "/ntp/Policies/{{ ntp_policy_moid }}"
            api_body:
              Tags: "{{ tags_to_apply }}"
            state: present
          when: tag_operation == 'set' or (removed_count | default(0) | int > 0)

        - name: No-op message for cleanup when nothing matched
          ansible.builtin.debug:
            msg: "No matching tag keys found on '{{ ntp_policy_name }}'; no update required."
          when: tag_operation == 'cleanup' and (removed_count | int == 0)

        - name: Mark worker success
          ansible.builtin.set_fact:
            policy_run_failed: false

      rescue:
        - name: Mark worker failure
          ansible.builtin.set_fact:
            policy_run_failed: true

        - name: Show worker failure details
          ansible.builtin.debug:
            msg: >-
              Failed to process '{{ ntp_policy_name }}' (operation: {{ tag_operation }}):
              {{ ansible_failed_result.msg | default('Unknown error') }}

- name: Build summary from parallel workers
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    worker_hosts: "{{ groups['ntp_policy_workers'] | default([]) }}"
    failed_policies: []

  tasks:
    - name: Extract failed policies from worker results
      ansible.builtin.set_fact:
        failed_policies: "{{ failed_policies + [hostvars[item].ntp_policy_name] }}"
      loop: "{{ worker_hosts }}"
      when: hostvars[item].policy_run_failed | default(false)
      loop_control:
        label: "{{ hostvars[item].ntp_policy_name | default(item) }}"

    - name: Build final counts
      ansible.builtin.set_fact:
        summary_total: "{{ worker_hosts | length }}"
        summary_failed: "{{ failed_policies | length }}"
        summary_successful: "{{ (worker_hosts | length) - (failed_policies | length) }}"

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - ""
          - "===== Policy Tag Operation Summary ====="
          - "Operation:        {{ hostvars['localhost'].requested_tag_operation }}"
          - "Total policies:    {{ summary_total }}"
          - "Successful:        {{ summary_successful }}"
          - "Failed:            {{ summary_failed }}"
          - ""

    - name: Show failed policies
      ansible.builtin.debug:
        msg: "X {{ item }}"
      loop: "{{ failed_policies }}"
      when: failed_policies | length > 0

    - name: Fail overall if any policy failed
      ansible.builtin.fail:
        msg: "{{ failed_policies | length }} policy operation(s) failed."
      when: failed_policies | length > 0

    - name: Success message
      ansible.builtin.debug:
        msg: "All {{ summary_total }} policy operations completed successfully!"
      when: failed_policies | length == 0
